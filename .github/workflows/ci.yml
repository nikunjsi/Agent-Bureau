name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (rebuilds native modules against Electron's ABI)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Package (electron-builder --dir)
        run: npm run package

      - name: Integration tests (native modules + Job Object, against the packaged app)
        run: npm run test:integration

      - name: E2E tests (packaged app:// window, against the packaged app)
        run: npm run test:e2e

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      # TEMPORARY (ci-green): evidence for the control.json ACL failure in
      # run 35724599688. Removed before the PR is ready.
      - name: DIAG control.json ACL on an elevated runner
        shell: pwsh
        run: |
          "GITHUB_ACTIONS=$env:GITHUB_ACTIONS"
          whoami
          whoami /groups | Select-String 'Mandatory Label|Administrators'
          "--- TEMP dir ACL"; icacls $env:TEMP
          foreach ($variant in 'asis','ownerfirst') {
            $d = Join-Path $env:TEMP "diag-$variant"; New-Item -ItemType Directory -Force $d | Out-Null
            $f = Join-Path $d 'control.json'
            node -e "require('fs').writeFileSync(process.argv[1], '{}')" $f
            "=== $variant: fresh file"; icacls $f; "owner: " + (Get-Acl $f).Owner
            if ($variant -eq 'ownerfirst') { icacls $f /setowner $env:USERNAME }
            icacls $f /inheritance:r /grant:r "$($env:USERNAME):(R,W)" /grant:r 'SYSTEM:(F)'
            "=== $variant: after tightening"; icacls $f; "owner: " + (Get-Acl $f).Owner
          }

      - name: Install dependencies (rebuilds native modules against Electron's ABI)
        run: npm ci

      # Pre-M11 S-6: a known high or critical advisory in a SHIPPED dependency
      # stops the build. Dev-only advisories are not gated here: the remaining
      # ones (vitest, vite, esbuild) need breaking upgrades, owned by M15 with
      # risk #36.
      - name: Production dependency audit (high and above)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Format check (prettier)
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: IPC surface matches docs/BUILD-SPEC.md §17.1
        run: npm run check:ipc-surface

      # AUDIT M0–M2 #24: the other three enumerable lists in the spec. Before
      # these, §5.1, §5.2 and §16.1 were kept in step with the code by
      # convention alone.
      - name: Schema matches docs/BUILD-SPEC.md §5.1
        run: npm run check:schema-spec

      - name: Event taxonomy matches docs/BUILD-SPEC.md §5.2
        run: npm run check:event-taxonomy

      - name: Settings registry matches docs/BUILD-SPEC.md §16.1
        run: npm run check:settings-spec

      - name: Unit tests
        run: npm test

      - name: Package (electron-builder --dir)
        run: npm run package

      # The integration and security suites prove real binary resolution
      # (§15.4) against a real Claude Code CLI, so CI installs one — the
      # exact version TESTED_ENGINE_VERSIONS pins (engineVersionDrift.ts).
      # --prefix puts it in %APPDATA%\npm, npm's own default global prefix
      # on Windows and one of §15.4's known install locations; the runner
      # image points npm's prefix elsewhere. Bureau deliberately never reads
      # process.env.PATH, so this is the location it will find, exactly as
      # it would on a user's machine. Never signed in: the one test that
      # needs a sign-in skips on GITHUB_ACTIONS and says so.
      - name: Install Claude Code CLI (the tested pin, into a §15.4 known location)
        shell: pwsh
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.238 --prefix "$env:APPDATA\npm"
          & "$env:APPDATA\npm\claude.cmd" --version

      - name: Integration tests (native modules + Job Object, against the packaged app)
        run: npm run test:integration

      # Pre-M11 P-11: §11.7 calls the security tests release-blocking, so they
      # are a gate of their own, not only files that happen to run inside the
      # other suites. After integration, because some need the packaged app.
      - name: Security tests (§11.7, release-blocking — both invocations)
        run: npm run test:security

      - name: Contract tests (§7.8 — FakeAdapter always; real-engine tests skip themselves, no CLI here and no opt-in)
        run: npm run test:contract

      - name: E2E tests (packaged app:// window, against the packaged app)
        run: npm run test:e2e
